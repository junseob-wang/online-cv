career-profile:
    title: Career Profile
    summary: |
      I am a B.S. student in Semiconductor Engineering at POSTECH, which I entered
      in 2025. Since Winter 2025, I have been an undergraduate research intern at
      the CAD & SoC Design Lab (CSDL) under Prof. Seokhyeong Kang. My research
      interest is design-technology co-optimization (DTCO), which jointly
      optimizes design and process for next-generation semiconductors.

