career-profile:
    title: Career Profile
    summary: |
      Junseob Wang entered Pohang University of Science and Technology
      (POSTECH), Pohang, South Korea, in 2025, and is currently pursuing the
      B.S. degree in Semiconductor Engineering.

      Since January 2026, he has been working as an undergraduate research
      intern in the CAD & SoC Design Lab (CSDL) under the supervision of
      Prof. Seokhyeong Kang. His research interests include design-technology
      co-optimization (DTCO), which jointly optimizes design and process for
      next-generation semiconductors, and design space optimization (DSO).

